<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responzívne karty - Riešenie</title>
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>🎨 Responzívne karty</h1>
        <p>Zmeň veľkosť okna prehliadača a sleduj zmeny!</p>
    </header>

    <main>
        <div class="card">
            <h2>📱 Karta 1</h2>
            <p>Táto karta mení farbu podľa veľkosti obrazovky.</p>
            <button>Klikni</button>
        </div>

        <div class="card">
            <h2>💻 Karta 2</h2>
            <p>Na mobile som červená, na tablete modrá, na desktope zelená.</p>
            <button>Klikni</button>
        </div>

        <div class="card">
            <h2>🖥️ Karta 3</h2>
            <p>Sleduj ako sa mení padding, border a zaoblenie rohov.</p>
            <button>Klikni</button>
        </div>
    </main>
</body>
</html>
